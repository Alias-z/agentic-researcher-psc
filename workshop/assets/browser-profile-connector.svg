<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of Zotero Connector in the built-in browser versus regular Chrome</title>
  <desc id="desc">The tested workshop route uses Codex's right-side built-in browser with Zotero Connector and institutional access in that profile. Optional regular Chrome requires both the ChatGPT browser extension and Zotero Connector in the same Chrome profile.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#23324d" flood-opacity=".15"/></filter>
    <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#202a39}.muted{fill:#667286}.small{font-size:18px}.body{font-size:21px}.head{font-size:30px;font-weight:700}.cardhead{font-size:23px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="660" fill="#edf3f8"/>
  <text class="ui muted small" x="60" y="40" letter-spacing="2">PSC SETUP ILLUSTRATION · TWO DIFFERENT BROWSER PROFILES</text>
  <rect x="56" y="68" width="690" height="536" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="56" y="68" width="690" height="58" rx="22" fill="#f7fafc"/>
  <rect x="56" y="110" width="690" height="16" fill="#f7fafc"/>
  <text class="ui cardhead" x="82" y="106">Codex right-side browser</text>
  <rect x="570" y="84" width="146" height="31" rx="15" fill="#d9f5e5"/>
  <text x="589" y="106" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#137045">COURSE ROUTE</text>
  <rect x="80" y="149" width="642" height="52" rx="10" fill="#eff4f8"/>
  <text class="ui small" x="102" y="182">@Browser  ·  publisher DOI page</text>
  <rect x="652" y="157" width="38" height="38" rx="9" fill="#cf3e3e"/>
  <text x="665" y="184" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">Z</text>
  <rect x="80" y="222" width="642" height="255" rx="12" fill="#fff" stroke="#d8e1ec"/>
  <text class="ui small muted" x="105" y="259">PUBLISHER ARTICLE</text>
  <text class="ui head" x="105" y="306">Stomatal research article</text>
  <text class="ui body" x="105" y="344">doi.org/10.xxxx/example</text>
  <rect x="105" y="366" width="140" height="34" rx="17" fill="#e9f5ed"/>
  <text x="126" y="389" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#137045">Full Access</text>
  <text class="ui small" x="105" y="439">University sign-in is in this browser profile.</text>
  <rect x="80" y="499" width="642" height="72" rx="12" fill="#e8f5ec"/>
  <text class="ui body" x="104" y="531" font-weight="650">Official Zotero Connector</text>
  <text class="ui small" x="104" y="557">Save from the article page, then verify in Zotero.</text>
  <rect x="775" y="68" width="370" height="536" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="775" y="68" width="370" height="58" rx="22" fill="#f7fafc"/>
  <rect x="775" y="110" width="370" height="16" fill="#f7fafc"/>
  <text class="ui cardhead" x="802" y="106">Regular Chrome</text>
  <rect x="801" y="149" width="318" height="43" rx="10" fill="#eff4f8"/>
  <text class="ui small" x="824" y="177">@Chrome  ·  optional route</text>
  <text class="ui body" x="802" y="235" font-weight="650">Same Chrome profile:</text>
  <circle cx="821" cy="278" r="16" fill="#2563eb"/><text x="815" y="285" font-family="Arial,sans-serif" font-size="21" fill="#fff">C</text>
  <text class="ui small" x="850" y="285">ChatGPT browser extension</text>
  <circle cx="821" cy="328" r="16" fill="#cf3e3e"/><text x="814" y="336" font-family="Arial,sans-serif" font-size="23" fill="#fff">Z</text>
  <text class="ui small" x="850" y="335">Zotero Connector</text>
  <path d="M801 372h318" stroke="#d8e1ec" stroke-width="2"/>
  <text class="ui small" x="802" y="410">Settings → Computer Use</text>
  <text class="ui small" x="802" y="443">Google Chrome → Manage</text>
  <rect x="801" y="494" width="318" height="77" rx="12" fill="#fff8e7" stroke="#edd59c"/>
  <text class="ui small" x="818" y="526">Chrome installed alone does</text>
  <text class="ui small" x="818" y="553">not connect it to Codex.</text>
  <text class="ui muted small" x="60" y="638">CHOOSE ONE ROUTE; THE CONNECTOR MUST BE IN THE BROWSER THAT HOLDS THE PUBLISHER PAGE.</text>
</svg>
