<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of Zotero automatic PDF setting and attachment verification</title>
  <desc id="desc">Zotero Settings, General, File Handling has Automatically attach associated PDFs and other files when saving items checked. The test collection shows an article with a PDF child attachment.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#23324d" flood-opacity=".17"/></filter>
    <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;fill:#202a39}.muted{fill:#667286}.small{font-size:18px}.body{font-size:21px}.head{font-size:29px;font-weight:700}.cardhead{font-size:22px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="660" fill="#edf3f8"/>
  <text class="ui muted small" x="60" y="40" letter-spacing="2">PSC SETUP ILLUSTRATION · ZOTERO DESKTOP</text>
  <rect x="55" y="70" width="750" height="522" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="55" y="70" width="750" height="60" rx="22" fill="#f8fafc"/>
  <rect x="55" y="112" width="750" height="18" fill="#f8fafc"/>
  <circle cx="86" cy="101" r="8" fill="#f28b82"/><circle cx="111" cy="101" r="8" fill="#fbbc65"/><circle cx="136" cy="101" r="8" fill="#81c995"/>
  <text class="ui body" x="175" y="109" font-weight="650">Zotero · Settings</text>
  <rect x="55" y="130" width="176" height="462" fill="#f3f6fa"/>
  <rect x="70" y="158" width="145" height="45" rx="10" fill="#dceafb"/>
  <text class="ui body" x="92" y="188" font-weight="650">General</text>
  <text class="ui body" x="92" y="238">Sync</text>
  <text class="ui body" x="92" y="286">Search</text>
  <text class="ui body" x="92" y="334">Export</text>
  <text class="ui head" x="265" y="189">General</text>
  <text class="ui cardhead" x="265" y="248">File Handling</text>
  <rect x="265" y="278" width="506" height="143" rx="13" fill="#f8fbff" stroke="#4389d9" stroke-width="3"/>
  <rect x="287" y="310" width="27" height="27" rx="5" fill="#2879d0"/>
  <path d="m293 323 5 5 10-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ui body" x="330" y="329">Automatically attach associated</text>
  <text class="ui body" x="330" y="362">PDFs and other files when</text>
  <text class="ui body" x="330" y="395">saving items</text>
  <rect x="265" y="452" width="506" height="97" rx="12" fill="#fff8e7" stroke="#edd59c"/>
  <text class="ui cardhead" x="287" y="485">Then verify each save</text>
  <text class="ui small" x="287" y="518">The setting does not guarantee every PDF.</text>
  <rect x="830" y="70" width="315" height="522" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="830" y="70" width="315" height="60" rx="22" fill="#f8fafc"/>
  <rect x="830" y="112" width="315" height="18" fill="#f8fafc"/>
  <text class="ui body" x="854" y="109" font-weight="650">Zotero · Library</text>
  <text class="ui small muted" x="854" y="174">COLLECTIONS</text>
  <rect x="847" y="190" width="280" height="42" rx="9" fill="#dceafb"/>
  <text class="ui body" x="871" y="218" font-weight="650">▣  test</text>
  <text class="ui small muted" x="854" y="276">ITEMS IN TEST</text>
  <text class="ui small" x="854" y="313">▾  Article title and DOI</text>
  <text class="ui small" x="884" y="350">▣  Full-text PDF</text>
  <circle cx="1097" cy="342" r="15" fill="#1d9d67"/>
  <path d="m1090 342 5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M854 380h266" stroke="#d8e1ec" stroke-width="2"/>
  <text class="ui small" x="854" y="417">Check DOI</text>
  <text class="ui small" x="854" y="453">Check collection</text>
  <text class="ui small" x="854" y="489">Open the PDF</text>
  <text class="ui muted small" x="60" y="638">PATH: ZOTERO → SETTINGS → GENERAL → FILE HANDLING</text>
</svg>
